version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docker
    labels:
      - docker
      - automated
    groups:
      docker_security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
      github_actions_security:
        applies-to: security-updates
        patterns:
          - '*'
  # The docs toolchain is a separate install: docs.yml pip-installs
  # docs/requirements-docs.txt to run MkDocs.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: docs
    labels:
      - documentation
      - automated
    groups:
      docs_toolchain:
        patterns:
          - '*'
      docs_security:
        applies-to: security-updates
        patterns:
          - '*'
